services:
  pufferpanel:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pufferpanel-custom:latest
    container_name: pufferpanel
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "5657:5657"
    volumes:
      - ../data/config:/etc/pufferpanel
      - ../data/data:/var/lib/pufferpanel
      - ../data/logs:/var/log/pufferpanel
      - /var/run/docker.sock:/var/run/docker.sock
