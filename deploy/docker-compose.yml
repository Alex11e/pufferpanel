services:
  pufferpanel:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pufferpanel-custom:latest
    container_name: pufferpanel
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 3 -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "8080:8080"
      - "5657:5657"
    volumes:
      - type: bind
        source: ${PANEL_CONFIG_DIR:-../data/config}
        target: /etc/pufferpanel
      - type: bind
        source: ${PANEL_DATA_DIR:-../data/data}
        target: /var/lib/pufferpanel
      - type: bind
        source: ${PANEL_LOGS_DIR:-../data/logs}
        target: /var/log/pufferpanel
      - /var/run/docker.sock:/var/run/docker.sock
